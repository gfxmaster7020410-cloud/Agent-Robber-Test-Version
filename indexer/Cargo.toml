[package]
name = "robber-indexer"
version = "0.1.0"
edition = "2021"
description = "High-performance AST indexer, symbol graph, and mmap search for Agent Robber"
license = "MIT"
publish = false

# Windows GNU builds need a real MinGW gcc (cc1) for rusqlite+tree-sitter.
# The rustup gnu toolchain linker is not enough by itself.

[lib]
name = "robber_indexer"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "robber-indexer"
path = "src/main.rs"

[[bin]]
name = "tools"
path = "src/bin/tools.rs"

[dependencies]
hex = "0.4"
memmap2 = "0.9"
rayon = "1.10"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
tree-sitter = "0.24"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
