<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Robber Browser Test App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #2980b9;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 4px;
            min-height: 100px;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
        }
        .success {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Agent Robber Browser Test App</h1>
        <p>This is a test page for the Visual UI Debugging & Playwright Browser Automation Loop.</p>
        
        <div>
            <button id="cleanBtn">Clean Test (No Errors)</button>
            <button id="errorBtn">Trigger Console Error</button>
            <button id="crashBtn">Trigger JS Crash</button>
            <button id="fetchBtn">Test Fetch (404)</button>
        </div>
        
        <div id="output">
            <p>Click a button to test browser automation...</p>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        
        document.getElementById('cleanBtn').addEventListener('click', () => {
            output.innerHTML = '<p class="success">✓ Clean test passed — no errors generated.</p>';
        });
        
        document.getElementById('errorBtn').addEventListener('click', () => {
            console.error('Test error: This is a deliberate console.error() call');
            output.innerHTML = '<p class="error">⚠ Console error triggered (check DevTools)</p>';
        });
        
        document.getElementById('crashBtn').addEventListener('click', () => {
            output.innerHTML = '<p class="error">💥 Triggering JS crash...</p>';
            // This will cause a runtime error
            setTimeout(() => {
                const obj = null;
                obj.nonExistentMethod(); // TypeError: Cannot read properties of null
            }, 100);
        });
        
        document.getElementById('fetchBtn').addEventListener('click', async () => {
            output.innerHTML = '<p>🌐 Testing fetch to /nonexistent...</p>';
            try {
                const response = await fetch('/nonexistent');
                if (!response.ok) {
                    output.innerHTML = `<p class="error">✗ Fetch failed: HTTP ${response.status}</p>`;
                }
            } catch (error) {
                output.innerHTML = `<p class="error">✗ Fetch error: ${error.message}</p>`;
            }
        });
        
        // Log app initialization
        console.log('Agent Robber test app initialized successfully');
    </script>
</body>
</html>
